steps:
- template: base-template.yml
- task: PowerShell@2
  displayName: 'Install gtksharp'
  inputs:
    targetType: 'inline'
    script: |
      $msiFile = "gtk-sharp-2.12.45.msi"
      Invoke-WebRequest "https://github.com/mono/gtk-sharp/releases/download/2.12.45/$msiFile" -OutFile $msiFile
      $arguments = "/i `"$msiFile`" /quiet"
      Start-Process msiexec.exe -ArgumentList $arguments -Wait

- task: JavaToolInstaller@0
  displayName: install JDK 11
  inputs:
    versionSpec: '11'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- task: PowerShell@2
  displayName: 'Install UWP SDK'
  inputs:
    targetType: 'inline'
    script: |
      # Install Windows 10 SDK 10.0.18362
      Write-Host "Installing Windows 10 SDK 10.0.18362..."

      # Try different methods to install the SDK
      try {
        # Method 1: Direct download and install
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2083338"
        $sdkPath = "$env:TEMP\winsdksetup.exe"

        Write-Host "Downloading Windows 10 SDK installer..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkPath

        Write-Host "Installing Windows 10 SDK (this may take several minutes)..."
        $process = Start-Process -FilePath $sdkPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDesktopDebuggers", "OptionId.WindowsDesktopSoftwareDevelopmentKit" -Wait -PassThru

        if ($process.ExitCode -eq 0) {
          Write-Host "Windows 10 SDK installed successfully"
        } else {
          Write-Warning "Windows 10 SDK installation completed with exit code: $($process.ExitCode)"
        }
      } catch {
        Write-Warning "Failed to install Windows 10 SDK: $($_.Exception.Message)"
        Write-Host "Attempting alternative installation via Visual Studio installer..."

        # Method 2: Via VS installer
        $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        if (Test-Path $vsInstaller) {
          & $vsInstaller modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.Windows10SDK.18362 --quiet --norestart
        }
      }

- task: PowerShell@2
  displayName: 'Install Android SDK Platforms'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
      Write-Host "ANDROID_SDK_ROOT: $env:ANDROID_SDK_ROOT"

      # Find sdkmanager
      $sdkManagerPaths = @(
        "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat",
        "$env:ANDROID_HOME\tools\bin\sdkmanager.bat",
        "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat",
        "$env:ANDROID_SDK_ROOT\tools\bin\sdkmanager.bat"
      )

      $sdkManager = $null
      foreach ($path in $sdkManagerPaths) {
        if (Test-Path $path) {
          $sdkManager = $path
          Write-Host "Found sdkmanager at: $path"
          break
        }
      }

      if (-not $sdkManager) {
        Write-Error "Could not find sdkmanager at any expected location"
        Write-Host "Checked paths: $($sdkManagerPaths -join ', ')"
        exit 1
      }

      # Accept licenses and install platforms
      Write-Host "Accepting Android SDK licenses..."
      echo y | & $sdkManager --licenses

      Write-Host "Installing Android API 27..."
      echo y | & $sdkManager "platforms;android-27"

      Write-Host "Installing Android API 28..."
      echo y | & $sdkManager "platforms;android-28"

      # Verify installations
      $platforms = & $sdkManager --list | Select-String "platforms;android-"
      Write-Host "Available platforms after installation:"
      Write-Host $platforms

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: custom
    custom: 'cake'
    workingDirectory: buildsystem

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'nugets'
    artifactName: 'nugets'