steps:
- template: base-template.yml
- task: PowerShell@2
  displayName: 'Install gtksharp'
  inputs:
    targetType: 'inline'
    script: |
      $msiFile = "gtk-sharp-2.12.45.msi"
      Invoke-WebRequest "https://github.com/mono/gtk-sharp/releases/download/2.12.45/$msiFile" -OutFile $msiFile
      $arguments = "/i `"$msiFile`" /quiet"
      Start-Process msiexec.exe -ArgumentList $arguments -Wait


- task: PowerShell@2
  displayName: 'Install UWP SDK 18362'
  inputs:
    targetType: 'inline'
    script: |
      # Check if Windows 10 SDK 18362 is already installed
      $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.18362.0"
      if (Test-Path $sdkPath) {
        Write-Host "Windows 10 SDK 18362 is already installed at: $sdkPath"
        exit 0
      }

      Write-Host "Installing Windows 10 SDK 18362..."

      # Method 1: Try Visual Studio installer first (more reliable on CI)
      $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
      if (Test-Path $vsInstaller) {
        Write-Host "Using Visual Studio installer..."
        try {
          $process = Start-Process -FilePath $vsInstaller -ArgumentList "modify", "--installPath", "C:\Program Files\Microsoft Visual Studio\2022\Enterprise", "--add", "Microsoft.VisualStudio.Component.Windows10SDK.18362", "--quiet", "--norestart" -Wait -PassThru
          if ($process.ExitCode -eq 0) {
            Write-Host "Windows 10 SDK 18362 installed successfully via Visual Studio installer"
            exit 0
          } else {
            Write-Warning "Visual Studio installer failed with exit code: $($process.ExitCode)"
          }
        } catch {
          Write-Warning "Failed to use Visual Studio installer: $($_.Exception.Message)"
        }
      }

      # Method 2: Direct download and install as fallback
      try {
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2083338"
        $sdkPath = "$env:TEMP\winsdksetup.exe"

        Write-Host "Downloading Windows 10 SDK installer..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkPath -UseBasicParsing

        Write-Host "Installing Windows 10 SDK (this may take several minutes)..."
        $process = Start-Process -FilePath $sdkPath -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDesktopSoftwareDevelopmentKit" -Wait -PassThru

        if ($process.ExitCode -eq 0 -or $process.ExitCode -eq 3010) {
          Write-Host "Windows 10 SDK installed successfully (exit code: $($process.ExitCode))"
          # Force refresh environment variables to simulate reboot effect
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        } else {
          Write-Warning "Windows 10 SDK installation failed with exit code: $($process.ExitCode)"
          exit 1
        }
      } catch {
        Write-Error "Failed to install Windows 10 SDK: $($_.Exception.Message)"
        exit 1
      }

- task: JavaToolInstaller@0
  displayName: 'Setup Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- task: PowerShell@2
  displayName: 'Install Android SDK Platforms'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
      Write-Host "ANDROID_SDK_ROOT: $env:ANDROID_SDK_ROOT"

      # Find sdkmanager
      $sdkManagerPaths = @(
        "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat",
        "$env:ANDROID_HOME\tools\bin\sdkmanager.bat",
        "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat",
        "$env:ANDROID_SDK_ROOT\tools\bin\sdkmanager.bat"
      )

      $sdkManager = $null
      foreach ($path in $sdkManagerPaths) {
        if (Test-Path $path) {
          $sdkManager = $path
          Write-Host "Found sdkmanager at: $path"
          break
        }
      }

      if (-not $sdkManager) {
        Write-Error "Could not find sdkmanager at any expected location"
        Write-Host "Checked paths: $($sdkManagerPaths -join ', ')"
        exit 1
      }

      # Check Java version
      Write-Host "Checking Java version..."
      try {
        $javaVersion = java -version 2>&1 | Select-String "version" | ForEach-Object { $_.ToString() }
        Write-Host "Java version: $javaVersion"
      } catch {
        Write-Warning "Could not determine Java version: $($_.Exception.Message)"
      }

      # Accept licenses and install platforms
      Write-Host "Accepting Android SDK licenses..."
      echo y | & $sdkManager --licenses

      Write-Host "Installing Android API 27..."
      echo y | & $sdkManager "platforms;android-27"
      if ($LASTEXITCODE -ne 0) {
        Write-Warning "Failed to install Android API 27 (exit code: $LASTEXITCODE)"
      }

      Write-Host "Installing Android API 28..."
      echo y | & $sdkManager "platforms;android-28"
      if ($LASTEXITCODE -ne 0) {
        Write-Warning "Failed to install Android API 28 (exit code: $LASTEXITCODE)"
      }

      # Verify installations
      $platforms = & $sdkManager --list | Select-String "platforms;android-"
      Write-Host "Available platforms after installation:"
      Write-Host $platforms

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: custom
    custom: 'cake'
    workingDirectory: buildsystem

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'nugets'
    artifactName: 'nugets'